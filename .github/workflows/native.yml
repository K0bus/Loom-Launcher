name: native

on:
  push:
    branches: [main, feat/slint-native-ui]
    paths: ["native/**", "src-tauri/src/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "src-tauri/src/**", ".github/workflows/native.yml"]

jobs:
  test:
    name: cargo test (crate natif)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Slint / Skia / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
            libssl-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Tests unitaires et d'intégration
        run: cargo test --locked

  tauri-check:
    name: cargo check (src-tauri, régression cœur métier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p ../dist && cargo check --locked

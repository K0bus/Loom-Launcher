[package]
name = "loom-native"
version = "0.1.0"
edition = "2021"
description = "Loom Launcher - native Slint UI"

# Crate indépendant : ne touche pas à src-tauri (cœur métier inchangé).
[workspace]

[dependencies]
slint = { version = "1.8", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
tokio = { version = "1", features = ["full"] }
# Dépendances requises par les modules de src-tauri montés tels quels (db, battlenet)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
open = "5.4.5"
libc = "0.2"
uuid = { version = "1.0", features = ["v4"] }
sha1 = "0.10"
sysinfo = "0.31"
zip = "2.2"
flate2 = "1.0"
tar = "0.4"
async-trait = "0.1"

[build-dependencies]
slint-build = "1.8"
